<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" role="img" aria-labelledby="title desc">
  <title id="title">LifeDecoded dashboard concept</title>
  <desc id="desc">A product preview concept with weekly insight cards, a workload and spending chart, and evidence notes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f8f7ff"/><stop offset="1" stop-color="#edf4f7"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5c4ac7"/><stop offset="1" stop-color="#8879e7"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%"><feDropShadow dx="0" dy="10" stdDeviation="16" flood-color="#29304a" flood-opacity=".08"/></filter>
    <style>
      .ui{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .muted{fill:#777c91}.dark{fill:#24243b}.small{font-size:14px}.label{font-size:16px;font-weight:600}.heading{font-size:24px;font-weight:700}
    </style>
  </defs>
  <rect width="1440" height="900" rx="28" fill="url(#bg)"/>
  <rect x="30" y="30" width="1380" height="840" rx="24" fill="#fff" filter="url(#shadow)"/>
  <rect x="30" y="30" width="250" height="840" rx="24" fill="#fbfaff"/>
  <path d="M256 30h24v840h-24z" fill="#fbfaff"/>
  <circle cx="70" cy="78" r="22" fill="#6655cf"/><path d="M61 79l7 7 13-16" fill="none" stroke="#fff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="104" y="75" class="ui dark" font-size="21" font-weight="750">LifeDecoded</text><text x="104" y="96" class="ui muted" font-size="11">PERSONAL INSIGHT SPACE</text>
  <rect x="48" y="135" width="214" height="48" rx="12" fill="#efedff"/><rect x="64" y="151" width="15" height="15" rx="4" fill="#6b59d2"/><text x="91" y="165" class="ui" font-size="15" font-weight="650" fill="#5143b0">Overview</text>
  <g class="ui muted" font-size="15"><rect x="64" y="213" width="15" height="15" rx="4" fill="#dedced"/><text x="91" y="226">My activity</text><rect x="64" y="269" width="15" height="15" rx="4" fill="#dedced"/><text x="91" y="282">Spending</text><rect x="64" y="325" width="15" height="15" rx="4" fill="#dedced"/><text x="91" y="338">Evidence &amp; methods</text></g>
  <rect x="48" y="738" width="214" height="100" rx="16" fill="#f1efff"/><text x="66" y="766" class="ui dark" font-size="14" font-weight="700">A gentle reminder</text><text x="66" y="790" class="ui muted" font-size="12">Patterns can offer clues,</text><text x="66" y="808" class="ui muted" font-size="12">not the whole story.</text>
  <text x="322" y="82" class="ui muted" font-size="14">MONDAY, YOUR PERSONAL OVERVIEW</text><text x="322" y="123" class="ui dark" font-size="34" font-weight="750">Your week, in perspective.</text><text x="322" y="153" class="ui muted" font-size="16">Explore how your time and spending move together.</text>
  <rect x="1205" y="64" width="160" height="42" rx="12" fill="#f6f5fb" stroke="#e9e7f2"/><circle cx="1227" cy="85" r="6" fill="#48a891"/><text x="1242" y="90" class="ui dark" font-size="13" font-weight="600">Personal workspace</text>
  <g filter="url(#shadow)">
    <rect x="320" y="190" width="325" height="145" rx="18" fill="#fff"/><rect x="665" y="190" width="325" height="145" rx="18" fill="#fff"/><rect x="1010" y="190" width="355" height="145" rx="18" fill="url(#hero)"/>
  </g>
  <text x="346" y="224" class="ui muted" font-size="14">TASKS COMPLETED</text><text x="346" y="270" class="ui dark" font-size="37" font-weight="750">18</text><text x="346" y="300" class="ui" font-size="13" fill="#39927e">↑ 4 from last week</text><circle cx="600" cy="245" r="22" fill="#e8f6f1"/><path d="M589 245l7 7 14-16" fill="none" stroke="#329982" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="691" y="224" class="ui muted" font-size="14">WEEKLY SPENDING</text><text x="691" y="270" class="ui dark" font-size="37" font-weight="750">₹4,820</text><text x="691" y="300" class="ui muted" font-size="13">Across 12 recorded purchases</text><circle cx="945" cy="245" r="22" fill="#f0edff"/><path d="M934 250l8-10 7 5 8-11" fill="none" stroke="#6c5bd3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1037" y="224" class="ui" font-size="14" fill="#e2ddff">INSIGHT STATUS</text><text x="1037" y="261" class="ui" font-size="24" font-weight="700" fill="#fff">Building your picture</text><text x="1037" y="291" class="ui" font-size="13" fill="#eeeaff">More weeks help reveal patterns.</text><rect x="1037" y="307" width="180" height="5" rx="2.5" fill="#bcb3ff" opacity=".7"/><rect x="1037" y="307" width="95" height="5" rx="2.5" fill="#fff"/>
  <rect x="320" y="360" width="700" height="300" rx="18" fill="#fff" stroke="#efedf5"/><text x="348" y="398" class="ui dark heading">Workload &amp; spending</text><text x="348" y="424" class="ui muted small">Illustrative weekly view · sample data</text>
  <rect x="753" y="382" width="12" height="12" rx="3" fill="#7969db"/><text x="773" y="393" class="ui muted" font-size="12">Overdue tasks</text><rect x="887" y="382" width="12" height="12" rx="3" fill="#59b8a1"/><text x="907" y="393" class="ui muted" font-size="12">Spending</text>
  <g stroke="#eeedf5" stroke-width="1"><path d="M365 472H976M365 516H976M365 560H976M365 604H976"/></g>
  <g fill="#7969db"><rect x="390" y="521" width="28" height="83" rx="5"/><rect x="468" y="490" width="28" height="114" rx="5"/><rect x="546" y="535" width="28" height="69" rx="5"/><rect x="624" y="475" width="28" height="129" rx="5"/><rect x="702" y="510" width="28" height="94" rx="5"/><rect x="780" y="463" width="28" height="141" rx="5"/><rect x="858" y="500" width="28" height="104" rx="5"/><rect x="936" y="530" width="28" height="74" rx="5"/></g>
  <path d="M404 548 C438 540 452 555 482 541 S530 532 560 547 S608 533 638 520 S686 535 716 522 S764 512 794 530 S842 542 872 524 S920 534 950 515" fill="none" stroke="#59b8a1" stroke-width="4" stroke-linecap="round"/>
  <g fill="#59b8a1" stroke="#fff" stroke-width="2"><circle cx="404" cy="548" r="5"/><circle cx="482" cy="541" r="5"/><circle cx="560" cy="547" r="5"/><circle cx="638" cy="520" r="5"/><circle cx="716" cy="522" r="5"/><circle cx="794" cy="530" r="5"/><circle cx="872" cy="524" r="5"/><circle cx="950" cy="515" r="5"/></g>
  <g class="ui muted" font-size="12" text-anchor="middle"><text x="404" y="628">Wk 1</text><text x="482" y="628">Wk 2</text><text x="560" y="628">Wk 3</text><text x="638" y="628">Wk 4</text><text x="716" y="628">Wk 5</text><text x="794" y="628">Wk 6</text><text x="872" y="628">Wk 7</text><text x="950" y="628">Wk 8</text></g>
  <rect x="1040" y="360" width="325" height="300" rx="18" fill="#fff" stroke="#efedf5"/><text x="1067" y="398" class="ui dark heading">What stands out</text><rect x="1067" y="420" width="270" height="90" rx="13" fill="#f6f4ff"/><circle cx="1090" cy="445" r="8" fill="#7969db"/><text x="1110" y="450" class="ui dark" font-size="14" font-weight="700">A pattern to explore</text><text x="1083" y="476" class="ui muted" font-size="12">Compare weeks with more overdue</text><text x="1083" y="493" class="ui muted" font-size="12">tasks against your baseline.</text><text x="1067" y="544" class="ui dark" font-size="14" font-weight="700">Evidence before conclusions</text><g class="ui muted" font-size="12"><text x="1067" y="570">• Weekly groups and date ranges</text><text x="1067" y="592">• Spending totals and thresholds</text><text x="1067" y="614">• Clear note when data is limited</text></g><rect x="1067" y="628" width="150" height="22" rx="11" fill="#eaf7f3"/><text x="1080" y="643" class="ui" font-size="11" font-weight="650" fill="#287d6d">Association, not causation</text>
  <rect x="320" y="686" width="1045" height="128" rx="18" fill="#fbfaff" stroke="#efedf5"/><circle cx="357" cy="726" r="16" fill="#efedff"/><path d="M357 716v20M347 726h20" stroke="#6c5bd3" stroke-width="2.5" stroke-linecap="round"/><text x="386" y="724" class="ui dark" font-size="17" font-weight="700">Insights should be understandable, not mysterious.</text><text x="386" y="750" class="ui muted" font-size="14">LifeDecoded shows the evidence behind a result and stays quiet when there is not enough data.</text><text x="386" y="784" class="ui" font-size="12" fill="#777c91">CONCEPT PREVIEW · Sample values and chart are illustrative, not live user data.</text>
</svg>